# Render Blueprint — free-tier deploy for testing (not the production Oracle VM
# path described in docs/architecture-decision.md). Deploy: create a Render
# account, "New +" -> "Blueprint", connect this repo, click Apply.
#
# Free-tier notes: the web service spins down after 15 minutes of inactivity
# (first request after that is slow), and the free Postgres database is
# deleted after 30 days unless upgraded to a paid plan.

databases:
  - name: quokkaquest-db
    plan: free
    databaseName: quokkaquest
    user: quokkaquest

services:
  - type: web
    name: quokkaquest-api
    runtime: docker
    dockerfilePath: ./infra/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    preDeployCommand: node apps/api/dist/scripts/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quokkaquest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: quokkaquest-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=packages/shared && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://quokkaquest-api.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
